name: MusicMe Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub secret: KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing GitHub secret: STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing GitHub secret: KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing GitHub secret: KEY_PASSWORD" && exit 1)

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          test -s my-upload-key.jks

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicMe-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
